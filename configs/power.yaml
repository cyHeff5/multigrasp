# Power Grasp - alle Finger schliessen gegen Handfläche und Daumen.
# Feix et al. 2014: Large Diameter, Medium Wrap, Power Sphere.

grasp_type: power

# Action-Gruppen: jede Gruppe = EIN Action-Signal (siehe precision.yaml).
# Bei Power ist jedes Gelenk seine eigene Gruppe -> alle 10 DOF unabhängig,
# identisch zum frueheren active_joints-Verhalten.
action_groups:
  - [servo0]
  - [servo1]
  - [servo2]
  - [servo3]
  - [servo4]
  - [servo5]
  - [servo6]
  - [servo7]
  - [servo8]
  - [servo9]

# Welche Joints zu welchem Finger gehören - bestimmt die Observations-Bits (1 Bit pro Finger).
finger_joints:
  pinky:  [servo2, servo3]
  ring:   [servo4, servo5]
  middle: [servo6, servo7]
  index:  [servo8, servo9]

# Lift wird ausgelöst wenn trigger_n Finger gleichzeitig Kontakt haben.
# Westling & Johansson 1984: Preload -> Loading -> Lift.
trigger_n: 2                       # Anzahl Finger für Trigger
trigger_confirmation_steps: 3      # muss trigger_n consecutive Schritte erfüllt sein
stabilization_steps: 30            # Schritte zwischen Trigger und Lift-Test
n_target: 3                        # Anzahl Finger für maximalen Step-Reward

action:
  delta_norm: 0.005                # max. Schrittgröße pro Policy-Step für Finger-Joints (normalisiert)
  thumb_abduction_delta: 0.005     # Schrittgröße für Daumen-Abduktion (servo0, bidirektional)
  thumb_abduction_range: [0.45, 0.55]  # erlaubter Positionsbereich für Daumen-Abduktion
  pip_caps: {}                     # keine PIP-Caps bei Power

observation:
  # q_target - q_measured > threshold -> Finger gilt als im Kontakt (binäres Signal).
  # threshold ist der Nominalwert (Referenz fuer die Parallel-Kalibrierung);
  # threshold_range randomisiert ihn pro Episode -> Policy haengt nicht an der
  # exakten Bit-Latenz. Untergrenze 0.02 = 2x gemessener Sim-Freilauf-q_delta
  # (0.0095, worst case substeps=4). Echte Schwelle: eval/calibration.py.
  threshold: 0.05
  threshold_range: [0.02, 0.08]

reward:
  # Potential-Based Reward Shaping (Ng et al. 1999): Phi = w_contact * min(n_contact, n_target)/n_target,
  # Shaping = gamma*Phi(s') - Phi(s). Policy-invariant + kein Toggle-Farming (siehe sim/reward.py).
  w_contact:     0.1               # Hoehe des Kontakt-Potentials Phi (max. Beitrag bei n_target Kontakten)
  w_pedestal:    0.05              # Penalty wenn Objekt das Podest berührt
  r_step:       -0.01              # Strafe pro Schritt, zwingt zur Effizienz
  r_lift_success: 10.0
  r_lift_fail:   -5.0
  gamma:         0.995             # MUSS mit ppo.yaml gamma uebereinstimmen (PBRS-Invarianz)

physics:
  motor_force:        {min: 0.4, max: 0.7}    # Motormoment in Nm (Firgelli ~40N × 12mm Hebel ≈ 0.5 Nm), pro Episode randomisiert
  fingertip_friction: {min: 1.5, max: 2.5}    # Reibwert Silikon-Fingerkappen, pro Episode randomisiert
  joint_damping: 0.1               # geschwindigkeitsproportionale Gelenkdämpfung
  max_velocity:  0.5               # max. Gelenkwinkelgeschwindigkeit in rad/s (Firgelli PQ12 mit 100:1 Getriebe)

sampler:
  # Feix et al. 2014 - Objektgrößen für Power Grasp.
  shapes: [sphere, cube, cylinder, rect_cylinder]
  sphere:        {size_cm:      {min: 5.0, max: 8.0}}
  cube:          {size_cm:      {min: 5.0, max: 8.0}}
  cylinder:      {thickness_cm: {min: 2.0, max: 5.0}, height_cm: {min: 10.0, max: 15.0}}
  rect_cylinder: {thickness_cm: {min: 2.0, max: 5.0}, width_cm:  {min: 4.0, max: 8.0}, height_cm: {min: 10.0, max: 15.0}}
  density_g_cm3:    {min: 0.3,  max: 1.5}    # Dichte (Schaum/Holz bis dichter Kunststoff); Masse = Dichte × Volumen
  lateral_friction: {min: 0.3,  max: 1.2}    # pro Episode randomisiert

pregrasp:
  distance_m:  0.004                # Abstand Hand-Referenzpunkt zur Objekt-Oberfläche
  jitter_xy_m: 0.005               # zufällige XY-Verschiebung der Pregrasp-Position
  jitter_z_m:  0.002               # zufällige Z-Verschiebung

episode:
  max_steps:    300                # Episodenlänge falls kein Trigger ausgelöst wird
  settle_steps: 15                 # Physik-Settle nach Spawn, bevor Episode beginnt
  sim_hz:       240
  # substeps ist der Nominalwert (bestimmt auch das step_dt der echten Hand:
  # substeps/sim_hz ~ 20.8 ms); substeps_range randomisiert die Kontrollrate pro
  # Episode auf 34-60 Hz, weil die echte Loop-Rate (step_dt + serielle I/O) nur
  # ungenau bekannt ist.
  substeps:       5                # Sim-Schritte pro Policy-Step -> 48 Hz Kontrollfrequenz
  substeps_range: [4, 7]

lift:
  height_m:      0.05
  lift_steps:    30
  hold_steps:    30
  success_m:     0.03              # Objekt muss >= 3 cm mitgehoben werden
  drop_tilt_rad: 0.8               # Objekt-Neigung ab der der Griff als Drop gilt (~46°)
