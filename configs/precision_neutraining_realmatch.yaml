# NEUTRAINING-Config (2026-08-24): identisch zu precision.yaml bis auf
#   action.mode: rate_probe   (Probe/langsam/schnell je Gruppe)
#   servo_model.enabled: true (Servo-Verhaltensmodell + Detektor in Sim)
# kinematics.stroke_angle_map: ENTSCHIEDEN 2026-08-25 per Foto-Sweep -> bleibt null
# (curve_b widerlegt, SENSOR_ANALYSIS_FINDINGS.md §9.6)
# (LABOR_SESSION1.md Block D). Kommentare der Basis-Config: siehe dort.
grasp_type: precision
action_groups:
- [servo6, servo8]
- [servo7, servo9]
finger_joints:
  middle: [servo6, servo7]
  index: [servo8, servo9]
trigger_n: 2
trigger_confirmation_steps: 3
# Griffabschluss liegt bei der Policy, nicht bei der Zustandsmaschine
# (RL_VERIFICATION.md 2c). trigger_n / trigger_confirmation_steps bleiben
# stehen: sie definieren jetzt die Skript-Baseline always_close, gegen die
# verglichen wird. trigger_min_steps ist reine Explorationsmaske.
trigger_mode: auto
trigger_min_steps: 40
# Timeout ohne bestaetigten Trigger zaehlt als Fehlschlag, kein Lift-Test mehr
# hinterher (RL_VERIFICATION.md 2f). ENTSCHEIDUNG LEON 2026-08-26: bleibt true.
# Die Frage der Arbeit ist, OB das RL den Griffabschluss lernen kann; dass es
# das am Anfang nicht kann, ist Teil der Lernkurve und kein Defekt. Ein frueher
# Abbruch bei 90k Steps (0 % Erfolg, jede Episode Timeout) beantwortet sie nicht.
#
# OFFENER PUNKT fuer den Sim-Real-Vergleich: eval/policy_runner.py hebt an der
# echten Hand auch ohne bestaetigten Trigger nach max_steps an und meldet nur
# "Kein Trigger - Griff lief bis max_steps". Solange das so ist, misst die Sim
# strenger als das Labor. Wer die Zahlen nebeneinanderstellt, muss entweder den
# Runner angleichen oder den Unterschied dazuschreiben.
timeout_is_failure: false
trigger_requires_contact: true
# Zweistufiger Probe-Trigger (RL_VERIFICATION 2e, Messbasis 9.7/9.9):
# ein Finger-Bit startet eine Halte-Probe; bestaetigt wird ueber das statische
# Detektor-Residuum (blockiert haelt k*Ueberfahrweg, frei kollabiert auf ~0).
# Ersetzt im auto-Modus die trigger_n/trigger_confirmation_steps-Maschine;
# die bleibt fuer Alt-Configs und als Vergleichsregel erhalten.
trigger_probe: {enabled: true, entry_n: 1, entry_steps: 3, probe_steps: 25,
  check_steps: 8, confirm_residual: 0.012, cooldown_steps: 20}
stabilization_steps: 30
n_target: 2
action:
  mode: rate_probe
  rates: {slow: 0.003, fast: 0.005}
  delta_norm: 0.005
  thumb_abduction_delta: 0.005
  thumb_abduction_range: [0.45, 0.55]
  pip_caps: {servo7: 0.5, servo9: 0.5}
observation:
  threshold: 0.05
  threshold_range: [0.02, 0.08]
contact_detector: {enabled: true, baseline_file: artifacts/calibration/qdelta_baseline.yaml,
  residual_min: 0.012, sigma_k: 4.0, persistence: 3, release_factor: 0.5, startup_mask_q: 0.13,
  settle_steps: 15, cusum_drift: 0.003, cusum_margin: 1.2, rate_scaling: true, rate_tau_steps: 6,
  std_floor: 0.001, restart_steps: 15, restart_pause_min: 5, use_in_sim: true}
servo_model:
  enabled: true
  tau_close_s: {min: 0.1, max: 0.17}
  tau_open_factor: {min: 1.5, max: 2.5}
  startup_deadband_q: {min: 0.04, max: 0.075}
  sensor_gain_err: 0.02
  sensor_offset: 0.008
  adc_quant_q: 0.0017
  sensor_noise_std: 0.001
  calib_tau_err: 0.15
  calib_mean_err_q: 0.003
  calib_sigma: 0.003
  # Kontaktnachgiebigkeit (SENSOR_ANALYSIS_FINDINGS.md 9.9, gemessen 2026-08-25):
  # onset_q = Ueberfahrweg zwischen physischem Kontakt und erstem messbaren
  # Signal, k = Steigung des statischen Restresiduums ueber dem Ueberfahrweg
  # (starre Blockierung waere k = 1.0). Beide sind objekt-/positionsabhaengig,
  # deshalb Bereiche statt Festwerte.
  contact_spring: {k: {min: 0.2, max: 0.3}, onset_q: {min: 0.10, max: 0.25}, release_steps: 3}
kinematics: {stroke_angle_map: null}
reward: {w_contact: 0.1, w_pedestal: 0.05, r_step: -0.01, r_lift_success: 10.0, r_lift_fail: -5.0,
  gamma: 0.995}
physics:
  motor_force: {min: 0.4, max: 0.7}
  fingertip_friction: {min: 1.5, max: 2.5}
  joint_damping: 0.1
  max_velocity: 0.5
sampler:
  shapes: [sphere, cube, cylinder, rect_cylinder]
  sphere:
    size_cm: {min: 4.0, max: 6.0}
  cube:
    size_cm: {min: 4.0, max: 6.0}
  cylinder:
    thickness_cm: {min: 1.0, max: 3.0}
    height_cm: {min: 5.0, max: 12.0}
  rect_cylinder:
    thickness_cm: {min: 1.0, max: 3.0}
    width_cm: {min: 1.0, max: 3.0}
    height_cm: {min: 5.0, max: 12.0}
  density_g_cm3: {min: 0.3, max: 1.5}
  lateral_friction: {min: 0.3, max: 1.2}
pregrasp: {distance_m: 0.004, jitter_xy_m: 0.005, jitter_z_m: 0.002}
episode:
  max_steps: 300
  settle_steps: 15
  sim_hz: 240
  substeps: 5
  substeps_range: [4, 7]
lift: {height_m: 0.05, lift_steps: 30, hold_steps: 30, success_m: 0.03, drop_tilt_rad: 0.8}

# Nur zum MESSEN, nicht zum Trainieren: identisch zu precision_neutraining.yaml,
# aber timeout_is_failure false — also derselbe Massstab wie eval/policy_runner.py,
# der an der echten Hand auch ohne bestaetigten Trigger nach max_steps anhebt.
# Damit wird die Sim-Zahl mit den Realzahlen vergleichbar.
